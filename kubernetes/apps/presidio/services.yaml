apiVersion: v1
kind: Service
metadata:
  name: presidio-analyzer
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: presidio-analyzer
    app.kubernetes.io/component: redaction
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: presidio-analyzer
    app.kubernetes.io/component: redaction
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: presidio-anonymizer
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: presidio-anonymizer
    app.kubernetes.io/component: redaction
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: presidio-anonymizer
    app.kubernetes.io/component: redaction
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
