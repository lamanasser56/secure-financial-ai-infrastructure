# GKE overlay. Input contract (from the Terraform module outputs): project ID, control-plane CIDR,
# gateway service account email; plus images.json (signed digests). Render with platform/clouds/gke/render.py.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../core/kubernetes
- gke.yaml
- generated/provider-egress.yaml
patches:
- target: {kind: ServiceAccount, name: gateway, namespace: platform}
  patch: |-
    - op: add
      path: /metadata/annotations
      value: {iam.gke.io/gcp-service-account: GATEWAY_GSA}
- target: {kind: ServiceAccount, name: redactor, namespace: platform}
  patch: |-
    - op: add
      path: /metadata/annotations
      value: {iam.gke.io/gcp-service-account: REDACTOR_GSA}
- target: {kind: StatefulSet, name: postgres, namespace: platform}
  patch: |-
    - op: add
      path: /spec/volumeClaimTemplates/0/spec/storageClassName
      value: agent-platform-retain
- target: {kind: Namespace}
  patch: |-
    - op: add
      path: /metadata/annotations
      value: {policy.network.gke.io/enable-deny-logging: "true"}
- target: {kind: NetworkPolicy}
  patch: |-
    - op: add
      path: /metadata/annotations
      value: {policy.network.gke.io/enable-logging: "true"}
