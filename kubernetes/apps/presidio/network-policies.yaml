apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-approved-clients-to-presidio-analyzer
  namespace: ai-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: presidio-analyzer
      app.kubernetes.io/component: redaction
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              portfolio.example/redaction-client: "true"
      ports:
        - protocol: TCP
          port: 3000
---
