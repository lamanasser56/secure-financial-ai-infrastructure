# Dependabot proposes updates as PRs only. Nothing here merges them: every PR goes through the
# normal review and merge rules. Cooldown delays version updates only; security updates are not delayed.
version: 2
updates:
  # The pip-compile inputs (requirements-*.in) at the root. Dependabot regenerates the hash-locked
  # requirements-*.txt outputs from them, using the options found in each compiled file
  # (--generate-hashes, --allow-unsafe, --strip-extras).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns: ["*"]
    ignore:
      # LiteLLM-family changes stay manual and reviewed (see requirements-litellm-candidate.in).
      - dependency-name: litellm
      - dependency-name: litellm-enterprise
      - dependency-name: litellm-proxy-extras

  # The pinned base images (tag plus digest) of every first-party Dockerfile.
  - package-ecosystem: docker
    directories:
      - /docker/database
      - /docker/gateway
      - /docker/google-sdp-context
      - /docker/redactor
      - /platform/agents/financial
      - /platform/agents/platform-guide
      - /platform/core/images
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # The hash-locked Python requirements are compiled for Python 3.12.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The Node builders must match the distroless nodejs24 runtime.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # A new PostgreSQL major needs a data migration.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  # Workflow actions, pinned by commit SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
