# RC1 trusted boundary migration; source only, requires new qualified artifacts and owner cutover.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bounds
  namespace: platform
spec:
  hard:
    limits.cpu: '4'
    limits.memory: 4Gi
    persistentvolumeclaims: '1'
    pods: '8'
    requests.cpu: 1500m
    requests.memory: 3Gi
    requests.storage: 10Gi
    services.loadbalancers: '0'
    services.nodeports: '0'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bounds
  namespace: apps
spec:
  hard:
    limits.cpu: '3'
    limits.memory: 2Gi
    persistentvolumeclaims: '0'
    pods: '6'
    requests.cpu: 1
    requests.memory: 1Gi
    services.loadbalancers: '0'
    services.nodeports: '0'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bounds
  namespace: ops
spec:
  hard:
    limits.cpu: '1'
    limits.memory: 1Gi
    persistentvolumeclaims: '1'
    pods: '3'
    requests.cpu: 500m
    requests.memory: 512Mi
    requests.storage: 1Gi
    services.loadbalancers: '0'
    services.nodeports: '0'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: platform
spec:
  limits:
    - default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: '1'
        memory: 1Gi
      type: Container
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: apps
spec:
  limits:
    - default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 20m
        memory: 32Mi
      max:
        cpu: '1'
        memory: 1Gi
      type: Container
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: ops
spec:
  limits:
    - default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: 500m
        memory: 512Mi
      type: Container
