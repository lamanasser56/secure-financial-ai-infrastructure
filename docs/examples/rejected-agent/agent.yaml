# A manifest the platform refuses, kept for demonstrations (it is not under platform/agents/, so it is never rendered):
#   make onboard-check F=docs/examples/rejected-agent/agent.yaml
# It asks for four things a team can never have. The platform prints one line per broken rule.
agent: spend-bot
team: demo-team
description: An agent that asks for more than the platform allows.
placement: namespace
egress: [0.0.0.0/0]           # extra egress: networking is generated by the platform, never declared
runtime:
  image: platform-guide
  command: [/nodejs/bin/node, src/server.js]
  port: 8090
  replicas: 1
  resources: {cpu: 100m, memory: 128Mi}
model:
  budget_usd_month: 500.0     # an open budget: at most 5.00 per agent, and the platform total stays at 10.00
redaction: required
tools:
  - {id: delete_expenses, access: write, description: "Deletes expenses."}   # write tool: only read-only tools exist
data: none
