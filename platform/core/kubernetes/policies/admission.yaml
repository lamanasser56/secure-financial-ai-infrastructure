# RC1 trusted boundary migration; source only, requires new qualified artifacts and owner cutover.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ops-agent-bounded-remediation
spec:
  failurePolicy: Fail
  matchConditions:
    - expression: request.userInfo.username in ['system:serviceaccount:ops:ops-agent',
        'system:serviceaccount:ops:ops-executor']
      name: ops-agent-only
  matchConstraints:
    resourceRules:
      - apiGroups:
          - '*'
        apiVersions:
          - '*'
        operations:
          - CREATE
          - UPDATE
          - DELETE
          - CONNECT
        resources:
          - '*/*'
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  validations:
    - expression: request.userInfo.username == 'system:serviceaccount:ops:ops-executor'
      message: ops-agent is read-only; only the independent approval executor may
        mutate
      reason: Forbidden
    - expression: variables.registered
      message: ops-agent may only UPDATE a registered Deployment (no other kind, verb
        or subresource)
      reason: Forbidden
    - expression: "!variables.registered || (\n  object.spec.selector == oldObject.spec.selector\
        \ &&\n  (has(object.spec.strategy) ? object.spec.strategy : {}) == (has(oldObject.spec.strategy)\
        \ ? oldObject.spec.strategy : {}) &&\n  (has(object.metadata.labels) ? object.metadata.labels\
        \ : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {})\
        \ &&\n  (has(object.spec.minReadySeconds) ? object.spec.minReadySeconds :\
        \ 0) == (has(oldObject.spec.minReadySeconds) ? oldObject.spec.minReadySeconds\
        \ : 0) &&\n  (has(object.spec.paused) ? object.spec.paused : false) == false)"
      message: ops-agent may not change selector, strategy, labels, minReadySeconds
        or pause a rollout
      reason: Forbidden
    - expression: "!variables.registered || (\n  int(object.spec.replicas) >= int(params.data[variables.key\
        \ + '.min']) &&\n  int(object.spec.replicas) <= int(params.data[variables.key\
        \ + '.max']))"
      message: replicas outside the registered bounds
      reason: Forbidden
    - expression: "!variables.registered || (variables.newT == variables.oldT) ||\
        \ (variables.newT.spec == variables.oldT.spec &&\n (has(variables.newT.metadata.labels)\
        \ ? variables.newT.metadata.labels : {}) ==\n   (has(variables.oldT.metadata.labels)\
        \ ? variables.oldT.metadata.labels : {}) &&\n variables.annNew.all(k, k ==\
        \ variables.restartKey || (k in variables.annOld && variables.annOld[k] ==\
        \ variables.annNew[k])) &&\n variables.annOld.all(k, k == variables.restartKey\
        \ || k in variables.annNew))"
      message: the Pod template may only be unchanged or changed by the rollout-restart
        annotation
      reason: Forbidden
  variables:
    - expression: request.namespace + '.' + request.name
      name: key
    - expression: request.operation == 'UPDATE' && request.resource.group == 'apps'
        && request.resource.resource == 'deployments' && (!has(request.subResource)
        || request.subResource == '')
      name: isDeploymentUpdate
    - expression: variables.isDeploymentUpdate && (variables.key + '.max') in params.data
        && (variables.key + '.min') in params.data
      name: registered
    - expression: 'variables.registered ? oldObject.spec.template : null'
      name: oldT
    - expression: 'variables.registered ? object.spec.template : null'
      name: newT
    - expression: 'variables.registered && has(variables.oldT.metadata.annotations)
        ? variables.oldT.metadata.annotations : {}'
      name: annOld
    - expression: 'variables.registered && has(variables.newT.metadata.annotations)
        ? variables.newT.metadata.annotations : {}'
      name: annNew
    - expression: '''kubectl.kubernetes.io/restartedAt'''
      name: restartKey
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ops-agent-bounded-remediation
spec:
  paramRef:
    name: ops-agent-registry
    namespace: ops
    parameterNotFoundAction: Deny
  policyName: ops-agent-bounded-remediation
  validationActions:
    - Deny
    - Audit
