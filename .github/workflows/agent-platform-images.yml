# Seven declared release service images. Git archive S is built on GitHub-hosted runners.
# Runs only after the CI workflow ("Validate infrastructure portfolio") succeeded on a push to main, and builds that
# exact commit (SC-001). build -> full-severity Trivy + fresh CISA KEV gate (HIGH/CRITICAL fail-closed) ->
# CycloneDX SBOM -> push by digest -> full-severity Trivy of the pushed digest + KEV and expiry gates (SC-002) -> keyless
# cosign (this job's OIDC identity, no device login, no stored key) -> cosign verify (exact workflow identity) ->
# Binary Authorization attestation with the Cloud KMS attestor key (GKE admission cannot enforce keyless signatures
# natively). An unsigned, unattested digest left in the registry by a blocked run is never admitted.
# The immutable tag sha-<S> is never moved: when it already exists (another run for the same S), that subject is not
# rebuilt but passes the same post-push gates and must already carry this workflow's signature and predicate for S.
# Credentials: Workload Identity Federation provider agent-platform-ci (repository + ref + workflow bound).
name: agent-platform-images

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ['Validate infrastructure portfolio']
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: agent-platform-images
  cancel-in-progress: false

jobs:
  ci-gate:
    # The commit to build must have a successful CI run on a push to main (also for a manual dispatch).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      build: ${{ steps.plan.outputs.build }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          if [[ "$EVENT" == workflow_run ]]; then
            # push only: a fork's pull request (even from a branch named main) runs CI as pull_request, never push.
            [[ "$RUN_CONCLUSION" == success && "$RUN_EVENT" == push && "$RUN_BRANCH" == main && "$RUN_REPO" == "$GITHUB_REPOSITORY" ]]
            sha="$RUN_SHA"
          else
            sha="$GITHUB_SHA"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&branch=main&status=success&per_page=1" --jq '.total_count')
          [[ "$ok" =~ ^[1-9][0-9]*$ ]] || { echo "no successful CI run on push to main for $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/image-inputs/go.mod
          cache-dependency-path: tools/image-inputs/go.sum
      - name: Derive current input ownership and compare a successful image-workflow plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          EVENT: ${{ github.event_name }}
          GOTOOLCHAIN: local
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$SHA" ]]
          go -C tools/image-inputs build -mod=readonly -o "$RUNNER_TEMP/image-inputs" .
          force=()
          if [[ "$EVENT" == workflow_dispatch ]]; then force=(--force); fi
          matrix=$(python3 scripts/plan-image-builds.py --tool "$RUNNER_TEMP/image-inputs" \
            --source "$SHA" --out "$RUNNER_TEMP/input-plan.json" "${force[@]}")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          build=$(python3 -c 'import json,sys; print(str(bool(json.loads(sys.argv[1])["include"])).lower())' "$matrix")
          printf 'build=%s\n' "$build" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-input-plan
          path: ${{ runner.temp }}/input-plan.json
          retention-days: 30

  image:
    needs: ci-gate
    if: needs.ci-gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      # A forced (manual) build of all seven reports every image; one failure does not cancel the rest.
      fail-fast: ${{ github.event_name != 'workflow_dispatch' }}
      matrix: ${{ fromJSON(needs.ci-gate.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: us-east1-docker.pkg.dev
      REPOSITORY: sdp-evaluation-images
      SHA: ${{ needs.ci-gate.outputs.sha }}
      IMAGE: ${{ matrix.image }}
      TARGET: ${{ matrix.target }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      SOURCE_ARGUMENT: ${{ matrix.source_argument }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Pinned qualification tools (Trivy 0.72.0, Syft 1.44.0, cosign 2.6.2; sha256-verified)
        run: mkdir -p "$RUNNER_TEMP/tools" && bash scripts/install-qualification-tools.sh "$RUNNER_TEMP/tools"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-input-plan
          path: ${{ runner.temp }}
      # Read-only registry lookup. No credentials file and no exported variables: the build below stays credential-free.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: lookup-auth
        with:
          workload_identity_provider: ${{ vars.AGENT_PLATFORM_CI_WIF_PROVIDER }}
          service_account: ${{ vars.AGENT_PLATFORM_CI_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Existing immutable sha-S tag (verified, never rebuilt)
        id: existing
        env:
          ACCESS_TOKEN: ${{ steps.lookup-auth.outputs.access_token }}
          PROJECT_ID: ${{ vars.AGENT_PLATFORM_PROJECT_ID }}
        run: |
          set -Eeuo pipefail
          [[ "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          digest=$(python3 scripts/existing-image-tag.py lookup --registry "$REGISTRY" --project "$PROJECT_ID" \
            --repository "$REPOSITORY" --image "$IMAGE" --source "$SHA")
          [[ -z "$digest" || "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          if [[ -n "$digest" ]]; then
            echo "::notice::sha-$SHA already names $IMAGE@$digest; verifying that subject instead of rebuilding"
          fi
      - name: Export exact S archive
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_RUN_ATTEMPT" == 1 && "$(git rev-parse HEAD)" == "$SHA" ]]
          archive="$RUNNER_TEMP/source.tar.gz"
          git archive --format=tar "$SHA" | gzip -n > "$archive"
          sha256sum "$archive" | cut -d' ' -f1 > "$RUNNER_TEMP/git-archive.sha256"
          mkdir "$RUNNER_TEMP/source-context"
          tar -xzf "$archive" -C "$RUNNER_TEMP/source-context"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        if: steps.existing.outputs.digest == ''
        with:
          version: v0.30.1
          driver: docker-container
          driver-opts: image=moby/buildkit@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
          platforms: linux/amd64
          use: true
          cache-binary: false
      - name: Build exact S on the hosted runner (no cloud credentials)
        if: steps.existing.outputs.digest == ''
        run: |
          set -Eeuo pipefail
          build_context="$RUNNER_TEMP/source-context"
          source_args=()
          if [[ -n "$SOURCE_ARGUMENT" ]]; then source_args=(--build-arg "$SOURCE_ARGUMENT=$SHA"); fi
          docker buildx build --platform linux/amd64 "${source_args[@]}" --target "$TARGET" \
            --file "$build_context/$DOCKERFILE" --provenance=false --sbom=false \
            --tag "local/$IMAGE:${SHA}" --load "$build_context"
      - name: Trivy (all severities and KEV; fail-closed) and SBOM
        if: steps.existing.outputs.digest == ''
        run: |
          set -Eeuo pipefail
          image="local/$IMAGE:${SHA}"
          "$RUNNER_TEMP/tools/trivy" image --exit-code 0 --ignore-unfixed=false \
            --format json --output "$RUNNER_TEMP/trivy.json" "$image"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 \
            --output "$RUNNER_TEMP/kev.json" \
            https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
          python3 scripts/reviewed-image-exception-gate.py "$RUNNER_TEMP/trivy.json" "$image" \
            "$IMAGE" "$RUNNER_TEMP/kev.json" policy/reviewed-image-exceptions.json \
            "$RUNNER_TEMP/trivy-prepush-gate.json"
          "$RUNNER_TEMP/tools/syft" "$image" -o "cyclonedx-json=$RUNNER_TEMP/sbom.cdx.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['bomFormat']=='CycloneDX' and d['components']" "$RUNNER_TEMP/sbom.cdx.json"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.AGENT_PLATFORM_CI_WIF_PROVIDER }}
          service_account: ${{ vars.AGENT_PLATFORM_CI_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '582.0.0'
          install_components: 'beta'
      - name: Push by digest, keyless sign, verify, KMS attest
        id: publish
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT_ID: ${{ vars.AGENT_PLATFORM_PROJECT_ID }}
          EXISTING: ${{ steps.existing.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          name="$IMAGE"
          remote="$REGISTRY/$PROJECT_ID/$REPOSITORY/$name:sha-$SHA"
          printf '%s' "$ACCESS_TOKEN" | docker login "https://$REGISTRY" -u oauth2accesstoken --password-stdin >/dev/null
          if [[ -n "$EXISTING" ]]; then
            # sha-S is immutable and already names a subject: never rebuild, push, retag or re-sign it. Its pre-push
            # evidence is taken from that exact registry subject, through the same gates as a fresh build.
            [[ "$EXISTING" =~ ^sha256:[0-9a-f]{64}$ ]]
            digest="$EXISTING"
            ref="$REGISTRY/$PROJECT_ID/$REPOSITORY/$name@$digest"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 \
              --output "$RUNNER_TEMP/kev.json" \
              https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
            "$RUNNER_TEMP/tools/trivy" image --exit-code 0 --ignore-unfixed=false \
              --format json --output "$RUNNER_TEMP/trivy.json" "$ref"
            python3 scripts/reviewed-image-exception-gate.py "$RUNNER_TEMP/trivy.json" "$ref" \
              "$name" "$RUNNER_TEMP/kev.json" policy/reviewed-image-exceptions.json \
              "$RUNNER_TEMP/trivy-prepush-gate.json"
            "$RUNNER_TEMP/tools/syft" "registry:$ref" -o "cyclonedx-json=$RUNNER_TEMP/sbom.cdx.json"
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['bomFormat']=='CycloneDX' and d['components']" "$RUNNER_TEMP/sbom.cdx.json"
          else
            docker tag "local/$name:$SHA" "$remote"
            docker push "$remote" > "$RUNNER_TEMP/push.log"
            digest=$(docker buildx imagetools inspect "$remote" --format '{{json .Manifest}}' | python3 -c "import json,sys; print(json.load(sys.stdin)['digest'])")
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          ref="$REGISTRY/$PROJECT_ID/$REPOSITORY/$name@$digest"
          # SC-002: every severity, KEV checked before any severity filter, fresh feed; blocks before signing.
          "$RUNNER_TEMP/tools/trivy" image --exit-code 0 --ignore-unfixed=false --format json \
            --output "$RUNNER_TEMP/trivy-full.json" "$ref"
          python3 scripts/reviewed-image-exception-gate.py "$RUNNER_TEMP/trivy-full.json" "$ref" \
            "$name" "$RUNNER_TEMP/kev.json" policy/reviewed-image-exceptions.json \
            "$RUNNER_TEMP/trivy-full-gate.json" | tee "$RUNNER_TEMP/reviewed-exception-gate.txt"
          python3 scripts/kev-release-gate.py "$RUNNER_TEMP/trivy-full-gate.json" "$ref" "$RUNNER_TEMP/kev.json" \
            policy/empty-exceptions.json | tee "$RUNNER_TEMP/release-gate.txt"
          python3 scripts/image-provenance.py --plan "$RUNNER_TEMP/input-plan.json" \
            --archive-sha256 "$(cat "$RUNNER_TEMP/git-archive.sha256")" --image "$IMAGE" --source "$SHA" \
            --out "$RUNNER_TEMP/predicate.json"
          if [[ -n "$EXISTING" ]]; then
            # Verify only: this workflow's keyless signature at S and the signed predicate recomputed for S.
            PYTHONPATH=platform/core/src python3 scripts/existing-image-tag.py verify --ref "$ref" \
              --project "$PROJECT_ID" --source "$SHA" --predicate "$RUNNER_TEMP/predicate.json" \
              --cosign "$RUNNER_TEMP/tools/cosign"
            echo existing_tag_verified > "$RUNNER_TEMP/subject-origin.txt"
          else
            "$RUNNER_TEMP/tools/cosign" sign --yes "$ref"
            "$RUNNER_TEMP/tools/cosign" attest --yes --type=custom \
              --predicate "$RUNNER_TEMP/predicate.json" "$ref"
            "$RUNNER_TEMP/tools/cosign" verify "$ref" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/agent-platform-images.yml@refs/heads/main" > /dev/null
            PYTHONPATH=platform/core/src python3 scripts/image-provenance.py --verify-ref "$ref" \
              --project "$PROJECT_ID" --source "$SHA" --predicate "$RUNNER_TEMP/predicate.json" \
              --cosign "$RUNNER_TEMP/tools/cosign"
            echo fresh_build > "$RUNNER_TEMP/subject-origin.txt"
          fi
          gcloud beta container binauthz attestations sign-and-create --project "$PROJECT_ID" --artifact-url "$ref" \
            --attestor "projects/$PROJECT_ID/attestors/agent-platform-ci" \
            --keyversion "projects/$PROJECT_ID/locations/us-east1/keyRings/agent-platform/cryptoKeys/binauthz-attestor/cryptoKeyVersions/1"
          python3 - "$ref" "$RUNNER_TEMP/trivy.json" "$SHA" "$RUNNER_TEMP/release-gate.txt" > "$RUNNER_TEMP/receipt.json" <<'PY'
          import hashlib, json, sys
          trivy = json.load(open(sys.argv[2]))
          findings = sum(v.get('Severity') in ('HIGH', 'CRITICAL') for r in trivy.get('Results', [])
                         for v in (r.get('Vulnerabilities') or []))
          print(json.dumps({'image': sys.argv[1], 'source_sha': sys.argv[3], 'trivy_high_critical': findings,
                            'release_gate': open(sys.argv[4]).read().strip(), 'cosign': 'keyless_verified',
                            'binauthz': 'attested_kms', 'sbom': 'cyclonedx'}, sort_keys=True))
          PY
          docker logout "https://$REGISTRY" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.image }}-evidence
          path: |
            ${{ runner.temp }}/receipt.json
            ${{ runner.temp }}/predicate.json
            ${{ runner.temp }}/git-archive.sha256
            ${{ runner.temp }}/sbom.cdx.json
            ${{ runner.temp }}/trivy.json
            ${{ runner.temp }}/trivy-full.json
            ${{ runner.temp }}/reviewed-exception-gate.txt
            ${{ runner.temp }}/release-gate.txt
            ${{ runner.temp }}/subject-origin.txt
          retention-days: 30
