model_list:
  - model_name: secure-financial-chat
    litellm_params:
      model: openai/fixture-model
      api_base: http://127.0.0.1:8767/v1
      api_key: os.environ/LOCAL_STUB_UPSTREAM_KEY
      timeout: 8
      max_retries: 0
litellm_settings:
  num_retries: 0
  telemetry: false
  set_verbose: false
  turn_off_message_logging: true
router_settings:
  num_retries: 0
  fallbacks: []
  context_window_fallbacks: []
  content_policy_fallbacks: []
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  allow_requests_on_db_unavailable: false
  disable_spend_logs: true
  user_api_key_cache_ttl: 0
