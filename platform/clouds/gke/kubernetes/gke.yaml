# RC1 trusted boundary migration; source only, requires new qualified artifacts and owner cutover.
apiVersion: v1
data:
  project_id: PROJECT_ID
kind: ConfigMap
metadata:
  name: platform-settings
  namespace: platform
---
allowVolumeExpansion: false
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: agent-platform-retain
parameters:
  type: pd-balanced
provisioner: pd.csi.storage.gke.io
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workload-identity-metadata
  namespace: platform
spec:
  egress:
    - ports:
        - port: 80
          protocol: TCP
      to:
        - ipBlock:
            cidr: 169.254.169.254/32
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - gateway
          - redactor
  policyTypes:
    - Egress
---
apiVersion: networking.gke.io/v1alpha1
kind: FQDNNetworkPolicy
metadata:
  annotations:
    policy.network.gke.io/enable-logging: 'true'
  name: redactor-provider
  namespace: platform
spec:
  egress:
    - matches:
        - name: dlp.us-east1.rep.googleapis.com
      ports:
        - port: 443
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redactor
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ops-agent-apiserver
  namespace: ops
spec:
  egress:
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: CONTROL_PLANE_CIDR
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ops-agent
  policyTypes:
    - Egress
---
apiVersion: networking.gke.io/v1alpha1
kind: NetworkLogging
metadata:
  name: default
spec:
  cluster:
    allow:
      delegate: true
      log: true
    deny:
      delegate: true
      log: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ops-executor-apiserver
  namespace: ops
spec:
  egress:
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: CONTROL_PLANE_CIDR
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ops-executor
  policyTypes:
    - Egress
---
allowVolumeExpansion: false
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: agent-runtime-disposable
parameters:
  type: pd-balanced
provisioner: pd.csi.storage.gke.io
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
