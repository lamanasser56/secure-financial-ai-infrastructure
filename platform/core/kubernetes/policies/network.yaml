              kubernetes.io/metadata.name: ops
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ops-executor
      ports:
        - port: 4001
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
    - Ingress
    - Egress
