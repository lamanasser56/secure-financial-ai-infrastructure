# RC1 trusted boundary migration; source only, requires new qualified artifacts and owner cutover.
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: gateway-boundary
  namespace: platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: gateway-boundary
    app.kubernetes.io/part-of: agent-platform
  name: gateway-boundary
  namespace: platform
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-boundary
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-boundary
        app.kubernetes.io/part-of: agent-platform
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - /usr/local/bin/python3.12
            - -m
            - agent_platform.gateway_boundary
          image: agent-platform/app
          name: gateway-boundary
          ports:
            - containerPort: 4000
              name: http4000
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 4000
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /secrets/gateway-boundary
              name: config
              readOnly: true
            - mountPath: /tmp
              name: tmp
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: gateway-boundary
      volumes:
        - name: config
          secret:
            defaultMode: 256
            secretName: gateway-boundary
        - emptyDir:
            medium: Memory
            sizeLimit: 32Mi
          name: tmp
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-boundary
  namespace: platform
spec:
  ports:
    - name: http4000
      port: 4000
      targetPort: 4000
  selector:
    app.kubernetes.io/name: gateway-boundary
  type: ClusterIP
---
