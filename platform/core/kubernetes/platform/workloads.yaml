# platform namespace: gateway (LiteLLM), redactor, Postgres (RLS), and the one-shot bootstrap jobs.
# Images are logical names; the cloud overlay pins them to signed digests. Programs come from the
# generated ConfigMaps (repo files, content-hashed by kustomize). Secrets are created by `make secrets`.
apiVersion: v1
kind: ServiceAccount
metadata: {name: gateway, namespace: platform}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: redactor, namespace: platform}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: postgres, namespace: platform}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: schema, namespace: platform}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: platform
  labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: agent-platform}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: {matchLabels: {app.kubernetes.io/name: gateway}}
  strategy: {type: Recreate}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: agent-platform}
    spec:
      serviceAccountName: gateway
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: gateway
        image: agent-platform/gateway
        command: [/usr/local/bin/python3.12, /programs/gateway_entry.py]
        ports: [{name: http, containerPort: 4000}]
        env:
        - {name: PORTFOLIO_PROJECT_ID, valueFrom: {configMapKeyRef: {name: platform-settings, key: project_id}}}
        - {name: LITELLM_MASTER_KEY, valueFrom: {secretKeyRef: {name: gateway, key: master_key}}}
        - {name: LITELLM_SALT_KEY, valueFrom: {secretKeyRef: {name: gateway, key: salt_key}}}
        - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: gateway, key: database_url}}}
        readinessProbe:
          httpGet: {path: /health/liveliness, port: 4000}
          periodSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet: {path: /health/liveliness, port: 4000}
          periodSeconds: 5
          failureThreshold: 36
        resources:
          requests: {cpu: 200m, memory: 640Mi}
          limits: {cpu: "1", memory: 1Gi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
        volumeMounts:
        - {name: programs, mountPath: /programs, readOnly: true}
        - {name: config, mountPath: /config, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: programs, configMap: {name: platform-programs, defaultMode: 0444}}
      - {name: config, configMap: {name: gateway-config, defaultMode: 0444}}
      - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 128Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redactor
  namespace: platform
  labels: {app.kubernetes.io/name: redactor, app.kubernetes.io/part-of: agent-platform}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: {matchLabels: {app.kubernetes.io/name: redactor}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redactor, app.kubernetes.io/part-of: agent-platform}
    spec:
      serviceAccountName: redactor
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: redactor
        image: agent-platform/redactor
        command: [/usr/local/bin/python3.12, /programs/redactor_server.py]
        ports: [{name: http, containerPort: 4003}]
        env:
        - {name: PORTFOLIO_PROJECT_ID, valueFrom: {configMapKeyRef: {name: platform-settings, key: project_id}}}
        readinessProbe:
          httpGet: {path: /healthz, port: 4003}
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
        volumeMounts:
        - {name: programs, mountPath: /programs, readOnly: true}
        - {name: clients, mountPath: /secrets/redactor, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: programs, configMap: {name: platform-programs, defaultMode: 0444}}
      - {name: clients, secret: {secretName: redactor, defaultMode: 0400}}
      - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: platform
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: agent-platform}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: agent-platform}
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: postgres
        image: agent-platform/database
        args: [postgres, -c, log_statement=none, -c, log_min_error_statement=panic, -c, password_encryption=scram-sha-256]
        ports: [{name: postgres, containerPort: 5432}]
        env:
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres, key: owner_password}}}
        readinessProbe:
          exec: {command: [pg_isready, -U, postgres, -h, 127.0.0.1]}
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 768Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
        - {name: socket, mountPath: /var/run/postgresql}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: socket, emptyDir: {medium: Memory, sizeLimit: 8Mi}}
      - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  volumeClaimTemplates:
  - metadata: {name: data, labels: {app.kubernetes.io/name: postgres}}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 10Gi}}
---
# One-shot, idempotent: roles (non-owner, NOBYPASSRLS), databases, LiteLLM schema, RLS tenant schema,
# synthetic fixtures, then (once the gateway is ready) the scoped virtual keys with their monthly budgets.
# Re-running changes nothing that already exists.
apiVersion: batch/v1
kind: Job
metadata: {name: schema, namespace: platform, labels: {app.kubernetes.io/name: schema}}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata: {labels: {app.kubernetes.io/name: schema}}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: schema
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: schema
        image: agent-platform/app
        command: [/usr/local/bin/python3.12, -m, agent_platform.programs.bootstrap, all]
        env: [{name: PYTHONPATH, value: /app/platform/src:/app}]
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
        volumeMounts:
        - {name: bootstrap, mountPath: /secrets/bootstrap, readOnly: true}
        - {name: sql, mountPath: /sql, readOnly: true}
      volumes:
      - {name: bootstrap, secret: {secretName: bootstrap, defaultMode: 0400}}
      - {name: sql, configMap: {name: database-sql, defaultMode: 0444}}
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: platform}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: gateway}
  ports: [{name: http, port: 4000, targetPort: 4000}]
---
apiVersion: v1
kind: Service
metadata: {name: redactor, namespace: platform}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: redactor}
  ports: [{name: http, port: 4003, targetPort: 4003}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: platform}
spec:
  type: ClusterIP
  clusterIP: None
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
