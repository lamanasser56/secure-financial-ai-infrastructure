# Example only; excluded from the base until the target cluster is inspected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nodelocal-dns-example
  namespace: ai-platform
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: REPLACE_WITH_NODELOCAL_DNS_CIDR
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
