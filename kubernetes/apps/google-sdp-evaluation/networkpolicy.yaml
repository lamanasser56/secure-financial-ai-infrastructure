apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: google-sdp-evaluation-isolation
  namespace: google-sdp-evaluation
  annotations:
    policy.network.gke.io/enable-logging: "true"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # NetworkPolicy cannot restrict an FQDN. HTTPS is permitted only by the
  # native FQDNNetworkPolicy: adding a broad rule here would bypass it.
  egress:
    # Native package: cluster kube-dns only, no alternate/public resolver.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Dataplane V2 GKE metadata; no Calico/alternate metadata allowance.
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
