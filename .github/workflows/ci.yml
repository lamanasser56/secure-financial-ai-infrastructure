name: Validate infrastructure portfolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up the pinned image-input tooling compiler
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/image-inputs/go.mod
          cache-dependency-path: tools/image-inputs/go.sum
      - name: Install validation dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Check Python dependency lock
        run: bash scripts/check-python-lock.sh
      - name: Validate contracts, manifests, and runtime controls
        run: bash scripts/check.sh
      - name: Lint documentation, YAML, workflows, and shell
        run: bash scripts/lint-repository.sh
      - name: Check whitespace
        run: git diff --check

  agents:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:  # real row-level security tests for the Financial Agent (finance.sql); digest-pinned
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0  # overlay tests verify the exact qualified main commit
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up the pinned image-input tooling compiler
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/image-inputs/go.mod
          cache-dependency-path: tools/image-inputs/go.sum
      - name: Set up Node.js for the browser suite
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Full repository-owned offline suite
        env:
          FINANCE_TEST_DSN: postgresql://postgres:ci-only-not-a-secret@127.0.0.1:5432/postgres
        run: make test

  gitleaks:
    # Scan every fetched branch and tag, including rc1-live-followup, and the PR merge ref.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  google-sdp-offline-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install optional evaluation dependencies
        run: python -m pip install --require-hashes -r requirements-google-sdp.txt
      - name: Check optional dependency lock
        run: |
          bash scripts/check-google-sdp-lock.sh
          bash scripts/check-google-sdp-runtime-lock.sh
      - name: Test offline adapter and runtime containment
        run: |
          python -B -m unittest discover -s tests/phase3/runtime -p 'test_google_sdp_adapter.py'
          python -B -m unittest discover -s tests/phase3/runtime -p 'test_composite_email_campaign.py' -k ProviderPacing
          python -B -m unittest discover -s tests/phase3/evaluation -p 'test_google_sdp_evaluation.py'
          python -B -m unittest discover -s tests/phase5 -p 'test_ai_path_containment.py'
      - name: Validate synthetic corpus without provider calls
        run: python -B scripts/evaluate-google-sdp.py > "$RUNNER_TEMP/google-sdp-offline-result.json"
      - name: Validate portfolio source and references
        run: |
          python -B scripts/validate.py
          python -B scripts/check-references.py
