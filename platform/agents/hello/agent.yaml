# Agent manifest: the only file a team writes to join the platform (docs/agent-developer-guide.md).
# `make onboard A=hello` validates it and generates everything else; the platform decides the security.
agent: hello
team: platform-examples
description: The smallest possible agent. It greets a user through the platform's model path, with no tools and no data.
placement: namespace          # its own namespace: agent-hello
runtime:
  image: app                  # an agent image that CI built, scanned, signed and pinned (platform/clouds/gke/images.json)
  command: [/usr/local/bin/python3.12, -m, agent_platform.programs.hello_agent]
  port: 8080
  replicas: 1
  resources: {cpu: 50m, memory: 96Mi}
model:
  budget_usd_month: 0.5       # its own gateway key; the platform total stays $10/month
redaction: required
tools: []
data: none
