apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-platform-quota
  namespace: ai-platform
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    requests.storage: 20Gi
    persistentvolumeclaims: "5"
    pods: "25"
    services: "15"
    services.loadbalancers: "0"
    services.nodeports: "0"
    configmaps: "30"
    secrets: "30"
