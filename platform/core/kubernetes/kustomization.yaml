# platform/core: cloud-agnostic base. Cloud overlays (platform/clouds/<cloud>/kubernetes) add identity,
# storage class, provider egress, API-server egress and signed image digests.
# Service programs and bootstrap SQL are owned by their signed images.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces/namespaces.yaml
  - policies/network.yaml
  - policies/quotas.yaml
  - policies/ops-agent-rbac.yaml
  - policies/admission.yaml
  - platform/workloads.yaml
  - apps/workloads.yaml
  - ops/workloads.yaml
  - platform/boundaries.yaml
  - agents   # GENERATED by `make onboard` from platform/agents/*/agent.yaml
generatorOptions:
  disableNameSuffixHash: false
configMapGenerator:
  - name: gateway-config
    namespace: platform
    files:
      - litellm.yaml=platform/generated/litellm.yaml
