# Example only; excluded from the base. The image and Secret are placeholders.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: schema-migrator
  namespace: ai-platform
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: schema-migrate-example
  namespace: ai-platform
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-migrate-example
    spec:
      serviceAccountName: schema-migrator
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrator
          image: REPLACE_WITH_QUALIFIED_MIGRATOR_DIGEST
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: migration-database-credentials
                  key: MIGRATION_DATABASE_URL
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: schema-migrator-postgres-egress
  namespace: ai-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: schema-migrate-example
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
