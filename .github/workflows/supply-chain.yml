name: Qualify supply-chain controls

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Check Python dependency lock
        run: bash scripts/check-python-lock.sh
      - name: Install pinned scanner and signature tools
        run: |
          mkdir -p "$RUNNER_TEMP/qualification-bin"
          bash scripts/install-qualification-tools.sh "$RUNNER_TEMP/qualification-bin"
          printf '%s\n' "$RUNNER_TEMP/qualification-bin" >> "$GITHUB_PATH"
      - name: Qualify scanners, SBOM, and signatures on public inputs
        run: bash scripts/qualify-supply-chain.sh
